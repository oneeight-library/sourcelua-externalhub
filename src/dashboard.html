<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>OneEight Hub - Fleet & Auto Farm</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #07090e;
      --bg-surface: #0e131f;
      --bg-card: rgba(16, 22, 36, 0.7);
      --bg-card-hover: rgba(22, 30, 48, 0.85);
      --border: rgba(255, 255, 255, 0.07);
      --border-focus: rgba(99, 102, 241, 0.45);
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --primary-glow: rgba(99, 102, 241, 0.25);
      --emerald: #10b981;
      --emerald-glow: rgba(16, 185, 129, 0.2);
      --amber: #f59e0b;
      --rose: #f43f5e;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --mono: 'JetBrains Mono', monospace;
      --radius-sm: 10px;
      --radius-md: 16px;
      --radius-lg: 22px;
      --radius-xl: 28px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    
    body {
      background: var(--bg);
      background-image: 
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(99, 102, 241, 0.12), transparent),
        radial-gradient(ellipse 60% 40% at 100% 100%, rgba(16, 185, 129, 0.08), transparent);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* =========================================================================
       1. MOBILE-FIRST TOP HEADER
       ========================================================================= */
    header {
      height: 60px;
      padding: 0 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(7, 9, 14, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 60;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, #6366f1, #3b82f6);
      border-radius: var(--radius-sm);
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 16px;
      color: white;
      box-shadow: 0 4px 14px var(--primary-glow);
    }

    .brand-title {
      display: flex;
      flex-direction: column;
    }

    .brand-title h1 {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: -0.3px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .brand-title p {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
    }

    .pulse-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--amber);
      box-shadow: 0 0 8px currentColor;
    }
    .pulse-dot.online { background: var(--emerald); }
    .pulse-dot.kicked { background: var(--rose); animation: pulseAlert 1.2s infinite; }

    @keyframes pulseAlert {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.3); opacity: 0.6; }
    }

    /* Mobile Quick Account Switcher Button */
    .mobile-account-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px 10px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      color: var(--text);
    }
    .mobile-account-btn:hover { background: rgba(255, 255, 255, 0.08); }

    /* =========================================================================
       2. APP LAYOUT & ASYMMETRICAL RESPONSIVENESS
       ========================================================================= */
    .app-layout {
      display: flex;
      flex-direction: column;
      flex: 1;
      width: 100%;
    }

    /* Desktop Sidebar (Hidden on Mobile) */
    .sidebar {
      display: none;
    }

    /* Mobile Quick Fleet Bar (Horizontal Pill Reel) */
    .mobile-fleet-reel {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      overflow-x: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
      background: rgba(14, 19, 31, 0.4);
      border-bottom: 1px solid var(--border);
    }
    .mobile-fleet-reel::-webkit-scrollbar { display: none; }

    .fleet-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      color: var(--text-muted);
    }
    .fleet-pill:hover {
      background: rgba(255, 255, 255, 0.07);
      color: var(--text);
    }
    .fleet-pill.active {
      background: rgba(99, 102, 241, 0.15);
      border-color: rgba(99, 102, 241, 0.4);
      color: white;
      box-shadow: 0 2px 10px rgba(99, 102, 241, 0.2);
    }
    .fleet-pill.kicked {
      background: rgba(244, 63, 94, 0.12);
      border-color: rgba(244, 63, 94, 0.4);
      color: #fda4af;
    }

    /* Main Content Viewport */
    .content-viewport {
      flex: 1;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
    }

    /* Desktop Layout Rules */
    @media (min-width: 1024px) {
      .app-layout {
        display: grid;
        grid-template-columns: 310px 1fr;
        height: calc(100vh - 60px);
      }
      .mobile-fleet-reel { display: none; }
      .sidebar {
        display: flex;
        flex-direction: column;
        background: rgba(10, 14, 23, 0.7);
        border-right: 1px solid var(--border);
        backdrop-filter: blur(20px);
        overflow-y: auto;
      }
      .content-viewport {
        overflow-y: auto;
        padding: 24px 32px;
        gap: 20px;
        margin: 0;
        max-width: none;
      }
    }

    /* =========================================================================
       3. SIDEBAR STYLES (DESKTOP)
       ========================================================================= */
    .sidebar-head {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .sidebar-label {
      font-size: 11px;
      font-weight: 800;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }
    .sidebar-badge {
      font-size: 11px;
      padding: 2px 8px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 999px;
      color: var(--text-muted);
      font-weight: 700;
    }
    .sidebar-list {
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .sidebar-item {
      padding: 12px 14px;
      border-radius: var(--radius-md);
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid transparent;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .sidebar-item:hover {
      background: rgba(255, 255, 255, 0.05);
      border-color: var(--border);
    }
    .sidebar-item.active {
      background: rgba(99, 102, 241, 0.12);
      border-color: rgba(99, 102, 241, 0.35);
      box-shadow: 0 4px 15px rgba(99, 102, 241, 0.1);
    }
    .sidebar-item.kicked {
      background: rgba(244, 63, 94, 0.1);
      border-color: rgba(244, 63, 94, 0.35);
    }

    .item-avatar {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      display: grid;
      place-items: center;
      font-size: 14px;
      font-weight: 800;
      position: relative;
      flex-shrink: 0;
      overflow: hidden;
    }
    .item-avatar img, .hero-avatar img {
      width: 100%;
      height: 100%;
      border-radius: inherit;
      object-fit: cover;
      display: block;
    }
    .item-status-dot {
      position: absolute;
      bottom: -2px;
      right: -2px;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      border: 2px solid var(--bg);
      background: var(--amber);
    }
    .item-status-dot.online { background: var(--emerald); }
    .item-status-dot.kicked { background: var(--rose); }

    .item-info { flex: 1; min-width: 0; }
    .item-name {
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .item-cash {
      font-size: 11px;
      font-weight: 700;
      color: var(--emerald);
      margin-top: 2px;
    }
    .item-sub {
      font-size: 10px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    /* =========================================================================
       4. ASYMMETRICAL EDITORIAL HERO CARD (HUMAN DESIGN)
       ========================================================================= */
    .hero-card {
      background: linear-gradient(135deg, rgba(20, 27, 45, 0.8), rgba(11, 15, 26, 0.9));
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
      backdrop-filter: blur(25px);
    }

    /* Subtle decorative accent pill top edge */
    .hero-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 20px;
      width: 60px;
      height: 3px;
      background: var(--primary);
      border-radius: 0 0 3px 3px;
      box-shadow: 0 0 10px var(--primary);
    }
    .hero-card.theme-cdid::before { background: var(--emerald); box-shadow: 0 0 10px var(--emerald); }
    .hero-card.theme-menu::before { background: #3b82f6; box-shadow: 0 0 10px #3b82f6; }
    .hero-card.theme-kicked::before { background: var(--rose); box-shadow: 0 0 10px var(--rose); }

    .hero-top-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }

    .hero-identity {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .hero-avatar {
      width: 48px;
      height: 48px;
      overflow: hidden;
      border-radius: 14px;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.02));
      border: 1px solid var(--border);
      display: grid;
      place-items: center;
      font-size: 20px;
      font-weight: 800;
      flex-shrink: 0;
      box-shadow: inset 0 0 12px rgba(255, 255, 255, 0.05);
    }

    .hero-identity-text h2 {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -0.4px;
      line-height: 1.2;
    }

    .hero-status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 4px;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
    }

    .hero-actions-bar {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Asymmetric Focus Box: The Big Currency & Session Counter */
    .hero-asymmetric-panel {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      background: rgba(14, 20, 34, 0.6);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 16px;
    }

    @media (min-width: 640px) {
      .hero-asymmetric-panel {
        grid-template-columns: 1.4fr 1fr;
        align-items: center;
      }
    }

    .money-display {
      display: flex;
      flex-direction: column;
    }
    .money-label {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }
    .money-amount {
      font-size: 24px;
      font-weight: 800;
      color: var(--emerald);
      letter-spacing: -0.5px;
      font-family: var(--mono);
      margin-top: 2px;
      text-shadow: 0 0 20px var(--emerald-glow);
    }
    @media (min-width: 768px) {
      .money-amount { font-size: 28px; }
    }

    .session-stats-cluster {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .stat-chip {
      padding: 6px 12px;
      border-radius: var(--radius-sm);
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      font-size: 11px;
      font-weight: 700;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .stat-chip-label { font-size: 9px; color: var(--text-dim); text-transform: uppercase; }
    .stat-chip-value { color: var(--text); font-family: var(--mono); }

    /* =========================================================================
       5. HORIZONTAL SCROLLABLE TAB PILLS
       ========================================================================= */
    .tabs-strip {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
      padding-bottom: 2px;
      position: sticky;
      top: 60px;
      background: rgba(7, 9, 14, 0.8);
      backdrop-filter: blur(15px);
      z-index: 40;
      margin: 0 -4px;
      padding: 6px 4px;
    }
    .tabs-strip::-webkit-scrollbar { display: none; }

    .tab-pill {
      padding: 8px 16px;
      border-radius: var(--radius-sm);
      border: 1px solid transparent;
      background: rgba(255, 255, 255, 0.03);
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .tab-pill:hover { background: rgba(255, 255, 255, 0.06); color: var(--text); }
    .tab-pill.active {
      background: rgba(99, 102, 241, 0.15);
      border-color: rgba(99, 102, 241, 0.4);
      color: white;
    }
    .tab-pill.theme-cdid.active {
      background: rgba(16, 185, 129, 0.15);
      border-color: rgba(16, 185, 129, 0.4);
      color: #6ee7b7;
    }
    .tab-pill.theme-menu.active {
      background: rgba(59, 130, 246, 0.15);
      border-color: rgba(59, 130, 246, 0.4);
      color: #93c5fd;
    }

    /* =========================================================================
       6. CARDS & SECTIONS (CLEAN, NO OVER-INFO BACKEND)
       ========================================================================= */
    .card-box {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      backdrop-filter: blur(20px);
    }

    .card-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .card-head h3 {
      font-size: 13px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Interactive Control Rows */
    .action-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      transition: border-color 0.2s, background 0.2s;
    }
    .action-row:hover {
      background: rgba(255, 255, 255, 0.04);
      border-color: rgba(255, 255, 255, 0.12);
    }

    .action-meta h4 {
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
    }
    .action-meta p {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 3px;
      line-height: 1.4;
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 18px;
      border-radius: var(--radius-md);
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      border: none;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      text-decoration: none;
      min-height: 42px;
    }
    .btn:active { transform: scale(0.97); }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary), #4f46e5);
      color: white;
      box-shadow: 0 4px 14px var(--primary-glow);
    }
    .btn-primary:hover {
      background: linear-gradient(135deg, #4f46e5, #4338ca);
      box-shadow: 0 6px 20px var(--primary-glow);
    }

    .btn-emerald {
      background: linear-gradient(135deg, var(--emerald), #059669);
      color: white;
      box-shadow: 0 4px 14px var(--emerald-glow);
    }
    .btn-emerald:hover {
      background: linear-gradient(135deg, #059669, #047857);
      box-shadow: 0 6px 20px var(--emerald-glow);
    }

    .btn-rose {
      background: linear-gradient(135deg, var(--rose), #e11d48);
      color: white;
      box-shadow: 0 4px 14px rgba(244, 63, 94, 0.25);
    }

    .btn-outline {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      color: var(--text);
    }
    .btn-outline:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.15);
    }

    /* Modern Tactile Switch */
    .switch {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 24px;
      flex-shrink: 0;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: rgba(255, 255, 255, 0.1);
      transition: .3s cubic-bezier(0.16, 1, 0.3, 1);
      border-radius: 999px;
      border: 1px solid var(--border);
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 2px;
      bottom: 2px;
      background-color: white;
      transition: .3s cubic-bezier(0.16, 1, 0.3, 1);
      border-radius: 50%;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
    }
    input:checked + .slider {
      background-color: var(--emerald);
      border-color: var(--emerald);
    }
    input:checked + .slider:before {
      transform: translateX(20px);
    }

    /* Slider Range */
    .slider-box {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .slider-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    input[type=range] {
      -webkit-appearance: none;
      width: 100%;
      height: 6px;
      border-radius: 3px;
      background: rgba(255, 255, 255, 0.1);
      outline: none;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--primary);
      cursor: pointer;
      box-shadow: 0 0 10px var(--primary-glow);
    }

    /* Alert Banner */
    .alert-banner {
      background: linear-gradient(135deg, rgba(244, 63, 94, 0.15), rgba(190, 18, 60, 0.08));
      border: 1px solid rgba(244, 63, 94, 0.4);
      border-radius: var(--radius-md);
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }
    .alert-banner-left { display: flex; align-items: center; gap: 12px; }
    .alert-banner-title { font-size: 13px; font-weight: 800; color: #fca5a5; }
    .alert-banner-desc { font-size: 11px; color: #fecaca; margin-top: 2px; }

    /* Live Console Box */
    .console-terminal {
      background: #05070c;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 12px 14px;
      font-family: var(--mono);
      font-size: 11px;
      height: 200px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .log-line { display: flex; gap: 8px; line-height: 1.5; }
    .log-time { color: var(--text-dim); flex-shrink: 0; }
    .log-INFO { color: #94a3b8; }
    .log-SUCCESS { color: #34d399; font-weight: 600; }
    .log-WARN { color: #fbbf24; }
    .log-ERROR { color: #f87171; font-weight: 700; }

    /* Mobile Account Switcher Modal */
    .drawer-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(10px);
      z-index: 100;
      display: none;
      align-items: flex-end;
    }
    .drawer-overlay.open { display: flex; }
    .drawer-sheet {
      width: 100%;
      background: #0d121f;
      border-top: 1px solid var(--border);
      border-radius: var(--radius-xl) var(--radius-xl) 0 0;
      padding: 20px;
      max-height: 75vh;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      animation: slideUp 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
    .drawer-handle {
      width: 40px;
      height: 4px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 999px;
      margin: 0 auto 10px;
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header>
    <div class="brand-group">
      <div class="brand-icon">18</div>
      <div class="brand-title">
        <h1>OneEight Hub</h1>
        <p>Command Center</p>
      </div>
    </div>

    <div class="header-actions">
      <!-- Mobile Account Switcher Trigger -->
      <button class="mobile-account-btn" id="mobileAccountBtn" onclick="toggleMobileDrawer()">
        <span id="mobileAccountLabel">🌐 Semua Akun</span>
        <span style="font-size: 10px; opacity: 0.6;">▼</span>
      </button>

      <div class="status-badge">
        <span class="pulse-dot" id="headerWsDot"></span>
        <span id="headerWsStatus">Menghubungkan</span>
      </div>
    </div>
  </header>

  <div class="app-layout">
    
    <!-- DESKTOP SIDEBAR -->
    <aside class="sidebar">
      <div class="sidebar-head">
        <span class="sidebar-label">Daftar Akun Roblox</span>
        <span class="sidebar-badge" id="fleetBadge">0 Bot</span>
      </div>
      <div class="sidebar-list" id="desktopSidebarList">
        <!-- Rendered via JS -->
      </div>
    </aside>

    <!-- MAIN WRAPPER -->
    <main style="display: flex; flex-direction: column; flex: 1; overflow: hidden;">
      
      <!-- MOBILE FLEET HORIZONTAL REEL -->
      <div class="mobile-fleet-reel" id="mobileFleetReel">
        <!-- Rendered via JS -->
      </div>

      <!-- SCROLLABLE CONTENT VIEWPORT -->
      <div class="content-viewport" id="mainContentView">
        <!-- Rendered via JS -->
      </div>
    </main>

  </div>

  <!-- MOBILE DRAWER MODAL -->
  <div class="drawer-overlay" id="mobileDrawerOverlay" onclick="if(event.target === this) toggleMobileDrawer()">
    <div class="drawer-sheet">
      <div class="drawer-handle"></div>
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
        <h3 style="font-size: 15px; font-weight: 800;">Pilih Akun Roblox</h3>
        <button class="btn btn-outline" style="padding: 4px 12px; font-size: 11px;" onclick="toggleMobileDrawer()">Tutup</button>
      </div>
      <div id="drawerFleetList" style="display: flex; flex-direction: column; gap: 8px;">
        <!-- Rendered via JS -->
      </div>
    </div>
  </div>

  <script>
    const WS_URL = "__WS_URL__";
    let socket = null;
    let bots = new Map();
    let selectedBotId = "ALL";
    let activeTab = "tab_autofarm";
    let logsHistory = [];

    // =========================================================================
    // 1. GAME REGISTRY
    // =========================================================================
    const GameRegistry = {
      cdid_menu: {
        id: "cdid_menu",
        name: "CDID Main Menu",
        icon: "🏰",
        color: "#3b82f6",
        currency: "Rp",
        formatMoney: (num) => formatRupiah(num),
        metricLabel: "Status",
        metricUnit: "Lobby",
        defaultJob: "Server Gateway",
        tabs: [
          { id: "tab_server_gateway", label: "🌐 Gerbang Server & Map", render: (bot) => renderCDIDMenuPortal(bot) },
          { id: "tab_safety", label: "🛡️ Proteksi & Rejoin", render: (bot) => renderSafetyTab(bot) },
          { id: "tab_logs", label: "📟 Konsol", render: (bot) => renderLogsTab(bot) }
        ]
      },
      cdid: {
        id: "cdid",
        name: "CDID Jawa Timur",
        icon: "🚚",
        color: "#10b981",
        currency: "Rp",
        formatMoney: (num) => formatRupiah(num),
        metricLabel: "Terkirim",
        metricUnit: "Trips",
        defaultJob: "Truk Kargo",
        tabs: [
          { id: "tab_autofarm", label: "📦 Auto Farm Truk", render: (bot) => renderCDIDFarm(bot) },
          { id: "tab_nav", label: "🚗 Lokasi & Armada", render: (bot) => renderCDIDNav(bot) },
          { id: "tab_safety", label: "🛡️ Proteksi & Rejoin", render: (bot) => renderSafetyTab(bot) },
          { id: "tab_perf", label: "⚡ Hemat GPU", render: (bot) => renderPerfTab(bot) },
          { id: "tab_logs", label: "📟 Konsol", render: (bot) => renderLogsTab(bot) }
        ]
      },
      dds: {
        id: "dds",
        name: "Drag Drive Simulator",
        icon: "🏁",
        color: "#f59e0b",
        currency: "Coins",
        formatMoney: (num) => (num || 0).toLocaleString() + " Coins",
        metricLabel: "Balapan",
        metricUnit: "Races",
        defaultJob: "Drag Racer",
        tabs: [
          { id: "tab_autofarm", label: "🏁 Auto Drag Race", render: (bot) => renderDDSFarm(bot) },
          { id: "tab_safety", label: "🛡️ Proteksi & Rejoin", render: (bot) => renderSafetyTab(bot) },
          { id: "tab_perf", label: "⚡ Hemat GPU", render: (bot) => renderPerfTab(bot) },
          { id: "tab_logs", label: "📟 Konsol", render: (bot) => renderLogsTab(bot) }
        ]
      },
      generic: {
        id: "generic",
        name: "Roblox Game",
        icon: "🎮",
        color: "#6366f1",
        currency: "Cash",
        formatMoney: (num) => (num || 0).toLocaleString(),
        metricLabel: "Selesai",
        metricUnit: "Cycles",
        defaultJob: "Auto Farm",
        tabs: [
          { id: "tab_safety", label: "🛡️ Proteksi & Rejoin", render: (bot) => renderSafetyTab(bot) },
          { id: "tab_perf", label: "⚡ Hemat GPU", render: (bot) => renderPerfTab(bot) },
          { id: "tab_logs", label: "📟 Konsol", render: (bot) => renderLogsTab(bot) }
        ]
      }
    };

    function getGameConfig(gameId) {
      return GameRegistry[gameId] || GameRegistry.generic;
    }

    function formatRupiah(num) {
      if (!num) return "Rp 0";
      return "Rp " + Math.floor(num).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".");
    }

    // =========================================================================
    // 2. WEBSOCKET CONTROLLER
    // =========================================================================
    function initWebSocket() {
      const dot = document.getElementById("headerWsDot");
      const statusText = document.getElementById("headerWsStatus");

      socket = new WebSocket(WS_URL);

      socket.onopen = () => {
        dot.className = "pulse-dot online";
        statusText.innerText = "Online";
        addLog("System", "Koneksi gateway aktif", "SUCCESS");
      };

      socket.onclose = () => {
        dot.className = "pulse-dot";
        statusText.innerText = "Offline";
        addLog("System", "Koneksi terputus. Menghubungkan ulang...", "WARN");
        setTimeout(initWebSocket, 3000);
      };

      socket.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          handleSocketMessage(data);
        } catch (e) {}
      };
    }

    function handleSocketMessage(data) {
      if (data.type === "SYNC_BOTS") {
        bots.clear();
        (data.bots || []).forEach(b => {
          for (const [id, existing] of bots.entries()) {
            if (existing.name && b.name && existing.name.toLowerCase() === b.name.toLowerCase()) {
              bots.delete(id);
            }
          }
          bots.set(b.id || b.botId, b);
        });
        renderFleetNavigators();
        renderMainView();
      } else if (data.type === "BOT_JOINED") {
        for (const [id, existing] of bots.entries()) {
          if (existing.name && data.bot.name && existing.name.toLowerCase() === data.bot.name.toLowerCase()) {
            bots.delete(id);
            if (selectedBotId === id) selectedBotId = data.bot.botId;
          }
        }
        bots.set(data.bot.botId, data.bot);
        renderFleetNavigators();
        renderMainView();
        addLog(data.bot.name, `Akun terhubung (${data.bot.gameName || 'Roblox'})`, "SUCCESS", data.bot.botId);
      } else if (data.type === "BOT_LEFT") {
        bots.delete(data.botId);
        if (selectedBotId === data.botId) selectedBotId = "ALL";
        renderFleetNavigators();
        renderMainView();
        addLog(data.name || "Bot", "Akun offline", "WARN", data.botId);
      } else if (data.type === "BOT_TELEMETRY") {
        const existing = bots.get(data.botId);
        if (existing) {
          const oldGameId = existing.gameId;
          const oldIsKicked = existing.isKicked;
          const oldIsFarming = existing.isFarming;
          Object.assign(existing, data.payload || {});

          // In-place sidebar update tanpa menghapus DOM
          const sideCashEl = document.getElementById("sidebarCash_" + data.botId);
          if (sideCashEl) {
            const gameCfg = getGameConfig(existing.gameId);
            sideCashEl.innerText = existing.currentCash > 0 ? gameCfg.formatMoney(existing.currentCash) : "Memuat...";
          }
          const sideSubEl = document.getElementById("sidebarSub_" + data.botId);
          if (sideSubEl) {
            const gameCfg = getGameConfig(existing.gameId);
            const gameName = gameCfg.name || existing.gameName || "Roblox";
            const farmType = existing.job || gameCfg.defaultJob || "Auto Farm";
            if (existing.isKicked) {
              sideSubEl.innerHTML = `<span style="color: var(--rose); font-weight: 600;">${gameName} • Terputus</span>`;
            } else if (existing.isFarming) {
              sideSubEl.innerHTML = `<span style="color: #6ee7b7; font-weight: 600;">${gameName} • ${farmType}</span>`;
            } else {
              sideSubEl.innerHTML = `<span style="color: var(--text-muted);">${gameName} • Standby</span>`;
            }
          }

          // Jika terjadi perubahan mode game atau status kick, re-render dengan proteksi scroll
          const gotNewAvatar = !existing.avatarUrl && data.payload && data.payload.avatarUrl;
          if (oldGameId !== existing.gameId || oldIsKicked !== existing.isKicked || oldIsFarming !== existing.isFarming || gotNewAvatar) {
            safeRenderFleetNavigators();
            safeRenderMainView();
            return;
          }

          // Jika sedang melihat bot ini, update angka secara in-place (scroll posisi 100% aman!)
          if (selectedBotId === data.botId) {
            updateLiveBotTelemetryInPlace(existing);
          } else if (selectedBotId === "ALL") {
            const globalCardCash = document.getElementById("globalCash_" + data.botId);
            if (globalCardCash) {
              const gameCfg = getGameConfig(existing.gameId);
              globalCardCash.innerText = gameCfg.formatMoney(existing.currentCash);
            }
          }
        }
      } else if (data.type === "BOT_KICKED") {
        const existing = bots.get(data.botId);
        if (existing) {
          existing.isKicked = true;
          existing.kickReason = data.reason;
          existing.status = `KICKED (${data.reason})`;
          renderFleetNavigators();
          renderMainView();
        }
        addLog(data.botName || "Bot", `ROBLOX KICK: ${data.reason}`, "ERROR", data.botId);
      } else if (data.type === "BOT_LOG") {
        addLog(data.botName || "Bot", data.log, data.level, data.botId);
      }
    }

    function addLog(source, msg, level, botId = null) {
      const d = new Date();
      const timeStr = d.toTimeString().split(" ")[0];
      logsHistory.push({ time: timeStr, source, msg, level: level || "INFO", botId });
      if (logsHistory.length > 120) logsHistory.shift();

      const consoleBox = document.getElementById("terminalConsole");
      if (consoleBox && selectedBotId !== "ALL" && activeTab === "tab_logs") {
        const curBot = bots.get(selectedBotId);
        const isMatch = (botId && botId === selectedBotId) || (curBot && curBot.name && source.toLowerCase() === curBot.name.toLowerCase());
        if (isMatch) {
          if (consoleBox.innerHTML.includes("Belum ada log")) {
            consoleBox.innerHTML = "";
          }
          const isNearBottom = (consoleBox.scrollHeight - consoleBox.scrollTop - consoleBox.clientHeight) < 40;
          const div = document.createElement("div");
          div.className = "log-line";
          div.innerHTML = `<span class="log-time">[${timeStr}]</span> <span class="log-${level || 'INFO'}">[${source}] ${msg}</span>`;
          consoleBox.appendChild(div);
          if (isNearBottom) {
            consoleBox.scrollTop = consoleBox.scrollHeight;
          }
        }
      }
    }

    function sendBotCommand(botId, action, payload) {
      if (!socket || socket.readyState !== WebSocket.OPEN) return;
      socket.send(JSON.stringify({
        type: "COMMAND",
        targetBotId: botId,
        action: action,
        payload: payload || {}
      }));
    }

    function sendFleetCommand(action, payload) {
      sendBotCommand("ALL", action, payload);
    }

    function rejoinBot(botId) {
      sendBotCommand(botId, "REJOIN_SERVER");
      addLog("Controller", "Mengirim perintah Rejoin Server...", "WARN", botId);
    }

    function toggleAutoRejoin(botId, enabled) {
      sendBotCommand(botId, "TOGGLE_AUTO_REJOIN", { enabled });
    }

    function toggleMobileDrawer() {
      const overlay = document.getElementById("mobileDrawerOverlay");
      overlay.classList.toggle("open");
    }

    // =========================================================================
    // 3. NAVIGATION & FLEET RENDERING
    // =========================================================================
    function renderFleetNavigators() {
      const badge = document.getElementById("fleetBadge");
      if (badge) badge.innerText = bots.size + " Bot";

      // Update Mobile Header Label
      const mobileLabel = document.getElementById("mobileAccountLabel");
      if (selectedBotId === "ALL") {
        mobileLabel.innerText = "🌐 Semua Akun (" + bots.size + ")";
      } else {
        const sel = bots.get(selectedBotId);
        mobileLabel.innerText = sel ? (sel.name || "Akun") : "🌐 Semua Akun";
      }

      // 1. Render Mobile Fleet Horizontal Reel
      const reel = document.getElementById("mobileFleetReel");
      let reelHtml = `
        <div class="fleet-pill ${selectedBotId === 'ALL' ? 'active' : ''}" onclick="selectBot('ALL')">
          🌐 Semua Akun
        </div>
      `;
      for (const [id, b] of bots.entries()) {
        const isSelected = selectedBotId === id;
        const gameCfg = getGameConfig(b.gameId);
        reelHtml += `
          <div class="fleet-pill ${isSelected ? 'active' : ''} ${b.isKicked ? 'kicked' : ''}" onclick="selectBot('${id}')">
            ${b.avatarUrl ? `<img src="${b.avatarUrl}" style="width: 18px; height: 18px; border-radius: 999px; object-fit: cover; flex-shrink: 0;" onerror="this.style.display='none'" />` : `<span>${b.isKicked ? '🚨' : gameCfg.icon}</span>`}
            <span>${b.name || 'Bot'}</span>
          </div>
        `;
      }
      if (reel) reel.innerHTML = reelHtml;

      // 2. Render Desktop Sidebar List
      const desktopList = document.getElementById("desktopSidebarList");
      let sideHtml = `
        <div class="sidebar-item ${selectedBotId === 'ALL' ? 'active' : ''}" onclick="selectBot('ALL')">
          <div class="item-avatar">🌐</div>
          <div class="item-info">
            <div class="item-name">Semua Akun (Global)</div>
            <div class="item-sub">Kelola ${bots.size} Akun Terhubung</div>
          </div>
        </div>
      `;

      for (const [id, b] of bots.entries()) {
        const isSelected = selectedBotId === id;
        const gameCfg = getGameConfig(b.gameId);
        const initial = (b.name || "B").substring(0, 2).toUpperCase();
        const isKicked = b.isKicked;
        
        // Format Nama Game & Jenis Autofarm
        const gameName = gameCfg.name || b.gameName || "Roblox";
        const farmType = b.job || gameCfg.defaultJob || "Auto Farm";
        let subTextHtml = "";
        if (isKicked) {
          subTextHtml = `<span style="color: var(--rose); font-weight: 600;">${gameName} • Terputus</span>`;
        } else if (b.isFarming) {
          subTextHtml = `<span style="color: #6ee7b7; font-weight: 600;">${gameName} • ${farmType}</span>`;
        } else {
          subTextHtml = `<span style="color: var(--text-muted);">${gameName} • Standby</span>`;
        }

        sideHtml += `
          <div class="sidebar-item ${isSelected ? 'active' : ''} ${isKicked ? 'kicked' : ''}" onclick="selectBot('${id}')">
            <div class="item-avatar" style="${isKicked ? 'border-color: var(--rose);' : ''}">
              ${b.avatarUrl ? `<img src="${b.avatarUrl}" alt="${b.name}" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';" /><span style="display: none;">${initial}</span>` : (isKicked ? '🚨' : initial)}
              <div class="item-status-dot ${isKicked ? 'kicked' : (b.isFarming ? 'online' : '')}"></div>
            </div>
            <div class="item-info">
              <div class="item-name">
                ${b.name || 'Bot'}
                <span style="font-size: 10px; opacity: 0.8;">${gameCfg.icon}</span>
              </div>
              <div class="item-cash">${b.currentCash > 0 ? gameCfg.formatMoney(b.currentCash) : "Memuat..."}</div>
              <div class="item-sub">${subTextHtml}</div>
            </div>
          </div>
        `;
      }
      if (desktopList) desktopList.innerHTML = sideHtml;

      // 3. Render Drawer List
      const drawerList = document.getElementById("drawerFleetList");
      if (drawerList) {
        drawerList.innerHTML = sideHtml;
      }
    }

    function selectBot(botId) {
      selectedBotId = botId;
      const overlay = document.getElementById("mobileDrawerOverlay");
      if (overlay) overlay.classList.remove("open");
      renderFleetNavigators();
      renderMainView();
    }

    function setTab(tabName) {
      activeTab = tabName;
      renderMainView();
    }

    // =========================================================================
    // 4. MAIN VIEWPORT RENDERER
    // =========================================================================

    // =========================================================================
    // IN-PLACE TELEMETRY UPDATE (ZERO DOM RE-CREATION, ZERO SCROLL JUMP)
    // =========================================================================
    function updateLiveBotTelemetryInPlace(bot) {
      const gameCfg = getGameConfig(bot.gameId);
      
      const moneyEl = document.getElementById("heroMoneyAmount");
      if (moneyEl) moneyEl.innerText = gameCfg.formatMoney(bot.currentCash);

      const earnEl = document.getElementById("heroEarnings");
      if (earnEl) earnEl.innerText = "+" + gameCfg.formatMoney(bot.totalEarnings);

      const tripEl = document.getElementById("heroTripCount");
      if (tripEl) tripEl.innerText = (bot.tripCount || 0) + " " + (gameCfg.metricUnit || "Trips");

      const durEl = document.getElementById("heroDuration");
      if (durEl) durEl.innerText = bot.sessionTime || "00:00:00";

      const routeEl = document.getElementById("currentRouteVal");
      if (routeEl) routeEl.innerText = bot.currentRoute || "Standby";

      const vehEl = document.getElementById("currentVehicleStatusVal");
      if (vehEl) vehEl.innerText = bot.status || "Standby";

      const statusTextEl = document.getElementById("heroStatusText");
      if (statusTextEl) {
        const currentJob = bot.job || gameCfg.defaultJob || "Auto Farm";
        if (bot.isKicked) {
          statusTextEl.innerText = "Terputus (" + (bot.kickReason || "Disconnect") + ")";
          statusTextEl.style.color = "var(--rose)";
        } else if (bot.isFarming) {
          statusTextEl.innerText = bot.status || ("Aktif (" + currentJob + ")");
          statusTextEl.style.color = "var(--emerald)";
        } else {
          statusTextEl.innerText = bot.gameId === "cdid_menu" ? "Standby di Lobi" : ("Standby (" + gameCfg.name + ")");
          statusTextEl.style.color = "var(--text-muted)";
        }
      }

      const statusDotEl = document.getElementById("heroStatusDot");
      if (statusDotEl) {
        statusDotEl.className = "pulse-dot " + (bot.isKicked ? "kicked" : (bot.isFarming ? "online" : ""));
      }

      // Sync server code input if in lobby and not focused by user
      if (bot.serverCode) {
        const codeInput = document.getElementById("serverCodeInput_" + bot.botId);
        if (codeInput && document.activeElement !== codeInput) {
          codeInput.value = bot.serverCode;
        }
      }
    }

    function safeRenderMainView() {
      const container = document.getElementById("mainContentView");
      if (!container) return;

      const savedMainScroll = container.scrollTop;
      const tabsStrip = document.querySelector(".tabs-strip");
      const savedTabsScroll = tabsStrip ? tabsStrip.scrollLeft : 0;
      const consoleBox = document.getElementById("terminalConsole");
      const savedConsoleScroll = consoleBox ? consoleBox.scrollTop : 0;
      const isConsoleAtBottom = consoleBox ? ((consoleBox.scrollHeight - consoleBox.scrollTop - consoleBox.clientHeight) < 40) : true;

      renderMainView();

      container.scrollTop = savedMainScroll;
      const newTabsStrip = document.querySelector(".tabs-strip");
      if (newTabsStrip) newTabsStrip.scrollLeft = savedTabsScroll;

      const newConsole = document.getElementById("terminalConsole");
      if (newConsole) {
        if (isConsoleAtBottom) {
          newConsole.scrollTop = newConsole.scrollHeight;
        } else {
          newConsole.scrollTop = savedConsoleScroll;
        }
      }
    }

    function safeRenderFleetNavigators() {
      const reel = document.getElementById("mobileFleetReel");
      const savedReelScroll = reel ? reel.scrollLeft : 0;
      const desktopList = document.getElementById("desktopSidebarList");
      const savedSidebarScroll = desktopList ? desktopList.scrollTop : 0;

      renderFleetNavigators();

      const newReel = document.getElementById("mobileFleetReel");
      if (newReel) newReel.scrollLeft = savedReelScroll;
      const newSidebar = document.getElementById("desktopSidebarList");
      if (newSidebar) newSidebar.scrollTop = savedSidebarScroll;
    }
    function renderMainView() {
      const container = document.getElementById("mainContentView");
      if (!container) return;

      if (selectedBotId === "ALL") {
        renderGlobalOverview(container);
        return;
      }

      const bot = bots.get(selectedBotId);
      if (!bot) {
        selectedBotId = "ALL";
        renderGlobalOverview(container);
        return;
      }

      renderBotSpecificView(container, bot);
    }

    function renderGlobalOverview(container) {
      let farmingCount = 0;
      let kickedCount = 0;
      for (const [_, b] of bots.entries()) {
        if (b.isFarming) farmingCount++;
        if (b.isKicked) kickedCount++;
      }

      let cardsHtml = "";
      if (bots.size === 0) {
        cardsHtml = `
          <div style="text-align: center; padding: 48px 20px; color: var(--text-muted); background: var(--bg-card); border-radius: var(--radius-lg); border: 1px solid var(--border);">
            <div style="font-size: 36px; margin-bottom: 12px;">🎮</div>
            <h4 style="font-size: 15px; font-weight: 700; color: var(--text);">Belum Ada Akun Terhubung</h4>
            <p style="font-size: 12px; margin-top: 6px; max-width: 380px; margin-left: auto; margin-right: auto; line-height: 1.5;">
              Jalankan script loader di executor Roblox akun Anda untuk mulai mengontrol auto farm dari dashboard ini.
            </p>
          </div>
        `;
      } else {
        for (const [id, b] of bots.entries()) {
          const gameCfg = getGameConfig(b.gameId);
          const initial = (b.name || "B").substring(0, 2).toUpperCase();
          const isKicked = b.isKicked;

          cardsHtml += `
            <div class="action-row" style="cursor: pointer; ${isKicked ? 'border-color: rgba(244,63,94,0.35); background: rgba(244,63,94,0.05);' : ''}" onclick="selectBot('${id}')">
              <div style="display: flex; align-items: center; gap: 12px;">
                <div class="item-avatar" style="width: 42px; height: 42px;">
                  ${b.avatarUrl ? `<img src="${b.avatarUrl}" alt="${b.name}" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';" /><span style="display: none;">${initial}</span>` : (isKicked ? '🚨' : initial)}
                  <div class="item-status-dot ${isKicked ? 'kicked' : (b.isFarming ? 'online' : '')}"></div>
                </div>
                <div>
                  <h4 style="display: flex; align-items: center; gap: 6px;">
                    ${b.name || 'Roblox Player'}
                    <span style="font-size: 11px; opacity: 0.7;">${gameCfg.icon}</span>
                  </h4>
                  <p style="font-size: 12px; font-weight: 700; color: ${gameCfg.color}; font-family: var(--mono); margin-top: 2px;">
                    ${gameCfg.formatMoney(b.currentCash)}

                  <p style="font-size: 10px; margin-top: 2px;">
                    ${isKicked ? `<span style="color: var(--rose); font-weight: 600;">${gameCfg.name || 'Roblox'} • Terputus</span>` : (b.isFarming ? `<span style="color: #6ee7b7; font-weight: 600;">${gameCfg.name || 'Roblox'} • ${b.job || gameCfg.defaultJob || 'Auto Farm'}</span>` : `<span style="color: var(--text-muted);">${gameCfg.name || 'Roblox'} • Standby</span>`)}

                  <button class="btn ${b.isFarming ? 'btn-rose' : 'btn-emerald'}" style="padding: 6px 14px; font-size: 12px;" onclick="sendBotCommand('${id}', '${b.isFarming ? 'STOP_FARM' : 'START_FARM'}')">
                    ${b.isFarming ? 'Berhenti' : 'Mulai'}

                `}
                <button class="btn btn-outline" style="padding: 6px 12px; font-size: 11px;" onclick="selectBot('${id}')">Detail &rarr;</button>

      container.innerHTML = `
        <div class="hero-card">
          <div class="hero-top-row">
            <div class="hero-identity">
              <div class="hero-avatar">🌐</div>
              <div class="hero-identity-text">

        <div class="card-box">
          <div class="card-head">
            <h3>Daftar Akun Roblox Aktif</h3>

          <div style="display: flex; flex-direction: column; gap: 8px;">
            ${cardsHtml}
          </div>
        </div>

      `;
    }

    function renderBotSpecificView(container, bot) {
      const gameCfg = getGameConfig(bot.gameId);
      const isKicked = bot.isKicked;
      const isLobby = bot.gameId === "cdid_menu";

      // Tab Pills Horizontal
      let tabsHtml = "";
      gameCfg.tabs.forEach(t => {
        const isActive = activeTab === t.id;
        tabsHtml += `
          <button class="tab-pill theme-${bot.gameId === 'cdid_menu' ? 'menu' : (bot.gameId || 'cdid')} ${isActive ? 'active' : ''}" onclick="setTab('${t.id}')">
            ${t.label}
          </button>
        `;
      });

      const currentTabDef = gameCfg.tabs.find(t => t.id === activeTab) || gameCfg.tabs[0];
      const tabContentHtml = currentTabDef.render(bot);

      // Dynamic Humanized Status (Modular for any game/job)
      const currentJob = bot.job || gameCfg.defaultJob || "Auto Farm";
      let statusHuman = isLobby ? "Standby di Lobi" : `Standby (${gameCfg.name})`;
      let statusColor = "var(--text-muted)";
      if (isKicked) {
        statusHuman = "Terputus (" + (bot.kickReason || "Disconnect") + ")";
        statusColor = "var(--rose)";
      } else if (bot.isFarming) {
        statusHuman = bot.status || `Aktif (${currentJob})`;
        statusColor = "var(--emerald)";
      }

      container.innerHTML = `
        ${isKicked ? `
          <div class="alert-banner">
            <div class="alert-banner-left">
              <span style="font-size: 24px;">🚨</span>
              <div>
                <div class="alert-banner-title">Koneksi Roblox Terputus (Kick)</div>
                <div class="alert-banner-desc">Alasan: ${bot.kickReason || "Koneksi terputus dari game"}</div>
              </div>
            </div>
            <button class="btn btn-rose" onclick="rejoinBot('${bot.botId}')">Rejoin Sekarang</button>
          </div>
        ` : ''}

        <!-- ASYMMETRICAL EDITORIAL HERO -->
        <div class="hero-card theme-${isKicked ? 'kicked' : (isLobby ? 'menu' : 'cdid')}">
          <div class="hero-top-row">
            <div class="hero-identity">
              <div class="hero-avatar">
                ${bot.avatarUrl ? `<img src="${bot.avatarUrl}" alt="${bot.name}" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';" /><span style="display: none;">${gameCfg.icon}</span>` : (isKicked ? '🚨' : gameCfg.icon)}
              </div>
              <div class="hero-identity-text">
                <h2>${bot.name || 'Roblox Player'}</h2>
                <div class="hero-status-pill">
                  <span class="pulse-dot ${isKicked ? 'kicked' : (bot.isFarming ? 'online' : '')}" id="heroStatusDot"></span>
                  <span style="color: ${statusColor}; font-weight: 700;" id="heroStatusText">${statusHuman}</span>
                </div>
              </div>
            </div>

            <div class="hero-actions-bar">
              ${isKicked ? `
                <button class="btn btn-rose" onclick="rejoinBot('${bot.botId}')">Rejoin Server</button>
              ` : ''}
            </div>
          </div>

          <!-- ASYMMETRIC MONEY & REWARD PANEL -->
          <div class="hero-asymmetric-panel">
            <div class="money-display">
              <span class="money-label">Saldo Akun</span>
              <span class="money-amount" id="heroMoneyAmount">${gameCfg.formatMoney(bot.currentCash)}</span>
            </div>

            <div class="session-stats-cluster">
              <div class="stat-chip">
                <span class="stat-chip-label">Hasil Sesi Ini</span>
                <span class="stat-chip-value" style="color: var(--emerald);" id="heroEarnings">+${gameCfg.formatMoney(bot.totalEarnings)}</span>
              </div>
              <div class="stat-chip">
                <span class="stat-chip-label">${gameCfg.metricLabel || 'Selesai'}</span>
                <span class="stat-chip-value" id="heroTripCount">${bot.tripCount || 0} ${gameCfg.metricUnit}</span>
              </div>
              <div class="stat-chip">
                <span class="stat-chip-label">Durasi</span>
                <span class="stat-chip-value" id="heroDuration">${bot.sessionTime || "00:00:00"}</span>
              </div>
            </div>
          </div>
        </div>

        <!-- TABS STRIP -->
        <div class="tabs-strip">
          ${tabsHtml}
        </div>

        <!-- TAB BODY CONTENT -->
        <div style="display: flex; flex-direction: column; gap: 14px;">
          ${tabContentHtml}
        </div>
      `;
    }

              </div>
              <button class="btn btn-outline" style="width: 100%;" onclick="sendBotCommand('${bot.botId}', 'JOIN_MAP', { mapKey: 'Jakarta', code: '${activeCode}' })">Masuk Jakarta</button>
            </div>

            <div class="action-row" style="flex-direction: column; align-items: stretch; gap: 10px;">
              <div>
                <h4 style="font-size: 13px;">⛰️ Bandung</h4>
                <p style="font-size: 11px; color: var(--text-muted);">Kota Kembang</p>
              </div>
              <button class="btn btn-outline" style="width: 100%;" onclick="sendBotCommand('${bot.botId}', 'JOIN_MAP', { mapKey: 'Bandung', code: '${activeCode}' })">Masuk Bandung</button>
            </div>

            <div class="action-row" style="flex-direction: column; align-items: stretch; gap: 10px;">

    // B. CDID AUTO FARM TRUK (JAWA TIMUR)
    function renderCDIDFarm(bot) {
      return `
        <div class="card-box">
          <div class="card-head">
            <h3>Kontrol Auto Farm Truk</h3>
          </div>

          <!-- Master Farm Switch -->

            <div class="action-meta">
              <h4>Jalankan Auto Farm Truk</h4>
              <p>Otomatis ambil kargo, bawa armada truk, dan kumpulkan gaji tanpa henti.</p>
            </div>
            <label class="switch">
              <input type="checkbox" ${bot.isFarming ? 'checked' : ''} onchange="sendBotCommand('${bot.botId}', '${bot.isFarming ? 'STOP_FARM' : 'START_FARM'}')">
              <span class="slider"></span>
            </label>
          </div>

          <!-- Filter Jarak Minimum -->
          <div class="action-row">
            <div class="slider-box">
              <div class="slider-head">
                <div class="action-meta">
                  <h4>Batas Jarak Minimum Rute</h4>
                  <p>Hanya terima pengiriman kargo bernilai tinggi.</p>
                </div>
                <span style="font-size: 13px; font-weight: 700; color: var(--emerald); font-family: var(--mono);" id="minDistVal">

              </div>
              <input type="range" min="50000" max="150000" step="5000" value="${bot.minDistance || 100000}"

          <div class="card-head">
            <h3>Informasi Pengiriman Saat Ini</h3>

            <div class="action-row" style="flex-direction: column; align-items: flex-start;">
              <span style="font-size: 10px; color: var(--text-dim); text-transform: uppercase;">Rute Tujuan</span>
              <span style="font-size: 13px; font-weight: 700; color: #93c5fd; margin-top: 2px;" id="currentRouteVal">${bot.currentRoute || 'Standby'}</span>

              <span style="font-size: 10px; color: var(--text-dim); text-transform: uppercase;">Status Kendaraan</span>

    function renderDDSFarm(bot) {

          </div>

            <div class="action-meta">

    function renderPerfTab(bot) {
      return `
        <div class="card-box">
          <div class="card-head">
            <h3>Optimasi & Hemat Daya</h3>
          </div>

          <div class="action-row">
            <div class="action-meta">
              <h4>Mode Hemat Layar (Low GPU)</h4>
              <p>Mematikan render 3D game Roblox di layar perangkat untuk menghemat CPU & GPU hingga 85%.</p>
            </div>
            <label class="switch">
              <input type="checkbox" ${bot.lowRender ? 'checked' : ''} onchange="sendBotCommand('${bot.botId}', 'TOGGLE_LOW_RENDER')">
              <span class="slider"></span>

          </div>
        </div>

    }

    function renderLogsTab(bot) {
      return `
        <div class="card-box">
          <div class="card-head" style="display: flex; justify-content: space-between; align-items: center;">
            <h3>Konsol Live: ${bot.name || 'Akun'}</h3>
            <button class="btn btn-outline" style="padding: 4px 12px; font-size: 11px;" onclick="clearLogs('${bot.botId}')">Bersihkan Log</button>
          </div>
          <div class="console-terminal" id="terminalConsole">
            ${renderLogsHTML(bot.botId, bot.name)}
          </div>
        </div>
      `;
    }

    function renderLogsHTML(targetBotId, targetBotName) {
      const filtered = logsHistory.filter(l => {
        if (!targetBotId) return true;
        return l.botId === targetBotId || (targetBotName && l.source && l.source.toLowerCase() === targetBotName.toLowerCase());
      });

      if (filtered.length === 0) {
        return `<div style="color: var(--text-dim); font-style: italic; padding: 12px 0;">Belum ada aktivitas log untuk akun ${targetBotName || 'ini'}...</div>`;
      }
      return filtered.map(l => `
        <div class="log-line">
          <span class="log-time">[${l.time}]</span>
          <span class="log-${l.level}">[${l.source}] ${l.msg}</span>
        </div>
      `).join('');
    }

    function clearLogs(targetBotId) {
      if (!targetBotId || targetBotId === "ALL") {
        logsHistory = [];
      } else {
        const b = bots.get(targetBotId);
        const name = b ? (b.name || "").toLowerCase() : "";
        logsHistory = logsHistory.filter(l => l.botId !== targetBotId && (!name || (l.source || "").toLowerCase() !== name));
      }
      const consoleBox = document.getElementById("terminalConsole");
      if (consoleBox) {
        const curBot = bots.get(selectedBotId);
        consoleBox.innerHTML = renderLogsHTML(selectedBotId, curBot ? curBot.name : "");
      }
    }

    // Jalankan WebSocket saat halaman dimuat
    initWebSocket();
  </script>
