<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OneEight External Hub - Modular Fleet Command Center</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #080a11;
      --bg-card: rgba(16, 21, 36, 0.75);
      --bg-surface: rgba(22, 29, 50, 0.6);
      --card-border: rgba(255, 255, 255, 0.08);
      --card-border-hover: rgba(99, 102, 241, 0.4);
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --primary-glow: rgba(99, 102, 241, 0.35);
      --accent: #818cf8;
      --success: #10b981;
      --success-glow: rgba(16, 185, 129, 0.3);
      --warning: #f59e0b;
      --danger: #ef4444;
      --danger-glow: rgba(239, 68, 68, 0.3);
      --text: #f3f4f6;
      --text-muted: #94a3b8;
      --mono: 'JetBrains Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg-dark);
      background-image: 
        radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.12) 0px, transparent 45%),
        radial-gradient(at 100% 100%, rgba(16, 185, 129, 0.08) 0px, transparent 45%);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    header {
      height: 64px;
      padding: 0 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--card-border);
      background: rgba(11, 15, 26, 0.85);
      backdrop-filter: blur(20px);
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .brand-wrap { display: flex; align-items: center; gap: 12px; }
    .brand-logo {
      width: 38px;
      height: 38px;
      background: linear-gradient(135deg, #6366f1, #3b82f6);
      border-radius: 10px;
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 17px;
      color: white;
      box-shadow: 0 0 20px var(--primary-glow);
    }
    .brand-info h1 { font-size: 16px; font-weight: 800; letter-spacing: -0.3px; display: flex; align-items: center; gap: 8px; }
    .brand-tag {
      font-size: 10px;
      padding: 2px 6px;
      background: rgba(99, 102, 241, 0.2);
      border: 1px solid rgba(99, 102, 241, 0.4);
      color: #a5b4fc;
      border-radius: 4px;
      font-weight: 700;
    }
    .brand-info p { font-size: 11px; color: var(--text-muted); font-weight: 500; }

    .header-right { display: flex; align-items: center; gap: 14px; }
    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--card-border);
    }
    .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--warning);
      box-shadow: 0 0 8px currentColor;
    }
    .pulse-dot.online { background: var(--success); }
    .pulse-dot.kicked { background: var(--danger); animation: pulseAlert 1.2s infinite; }

    @keyframes pulseAlert {
      0% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.4); opacity: 0.6; }
      100% { transform: scale(1); opacity: 1; }
    }

    .app-layout {
      display: grid;
      grid-template-columns: 310px 1fr;
      flex: 1;
      height: calc(100vh - 64px);
    }

    .sidebar {
      background: rgba(11, 15, 26, 0.7);
      border-right: 1px solid var(--card-border);
      backdrop-filter: blur(15px);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }
    .sidebar-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .sidebar-title { font-size: 12px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.8px; }
    .badge-count {
      background: rgba(99, 102, 241, 0.15);
      border: 1px solid rgba(99, 102, 241, 0.3);
      color: #a5b4fc;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
    }

    .fleet-list {
      display: flex;
      flex-direction: column;
      padding: 10px;
      gap: 6px;
    }
    .fleet-item {
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid transparent;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      background: rgba(255, 255, 255, 0.02);
    }
    .fleet-item:hover {
      background: rgba(255, 255, 255, 0.05);
      border-color: rgba(255, 255, 255, 0.08);
      transform: translateX(2px);
    }
    .fleet-item.active {
      background: rgba(99, 102, 241, 0.15);
      border-color: rgba(99, 102, 241, 0.4);
      box-shadow: 0 4px 15px rgba(99, 102, 241, 0.15);
    }
    .fleet-item.kicked {
      background: rgba(239, 68, 68, 0.12);
      border-color: rgba(239, 68, 68, 0.4);
    }
    .fleet-avatar {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: var(--bg-surface);
      border: 1px solid var(--card-border);
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 14px;
      position: relative;
      flex-shrink: 0;
    }
    .avatar-status {
      position: absolute;
      bottom: -2px;
      right: -2px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      border: 2px solid var(--bg-dark);
      background: var(--warning);
    }
    .avatar-status.online { background: var(--success); }
    .avatar-status.kicked { background: var(--danger); }
    .fleet-item-info { flex: 1; min-width: 0; }
    .fleet-item-name { font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 6px; }
    .fleet-item-sub { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

    .content-view {
      overflow-y: auto;
      padding: 24px 28px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* KICK ALERT BANNER */
    .kick-banner {
      background: linear-gradient(135deg, rgba(239, 68, 68, 0.2), rgba(185, 28, 28, 0.1));
      border: 1px solid rgba(239, 68, 68, 0.5);
      box-shadow: 0 0 25px rgba(239, 68, 68, 0.25);
      border-radius: 16px;
      padding: 18px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      animation: pulseAlert 2.5s infinite;
    }
    .kick-banner-left { display: flex; align-items: center; gap: 16px; }
    .kick-banner-icon { font-size: 28px; }
    .kick-banner-title { font-size: 15px; font-weight: 800; color: #fca5a5; display: flex; align-items: center; gap: 8px; }
    .kick-banner-desc { font-size: 12px; color: #fecaca; margin-top: 3px; font-family: var(--mono); }

    .bot-hero {
      background: var(--bg-card);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 22px 26px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      backdrop-filter: blur(20px);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
      position: relative;
      overflow: hidden;
    }
    .bot-hero::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; height: 3px;
      background: linear-gradient(90deg, var(--primary), var(--success));
    }
    .bot-hero.theme-cdid::before { background: linear-gradient(90deg, #10b981, #059669); }
    .bot-hero.theme-dds::before { background: linear-gradient(90deg, #f59e0b, #d97706); }
    .bot-hero.theme-kicked::before { background: linear-gradient(90deg, #ef4444, #b91c1c); }

    .bot-hero-left { display: flex; align-items: center; gap: 18px; }
    .bot-hero-avatar {
      width: 58px;
      height: 58px;
      border-radius: 14px;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.02));
      border: 1px solid var(--card-border);
      display: grid;
      place-items: center;
      font-size: 24px;
      font-weight: 800;
    }
    .bot-hero-title h2 { font-size: 20px; font-weight: 800; letter-spacing: -0.4px; }
    .bot-hero-chips { display: flex; align-items: center; gap: 8px; margin-top: 6px; flex-wrap: wrap; }
    .chip {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .chip.status { color: #6ee7b7; border-color: rgba(16, 185, 129, 0.3); }
    .chip.game { color: #93c5fd; border-color: rgba(59, 130, 246, 0.3); }
    .chip.kicked { color: #fca5a5; border-color: rgba(239, 68, 68, 0.5); background: rgba(239, 68, 68, 0.15); }

    .hero-actions { display: flex; align-items: center; gap: 10px; }

    .tabs-bar {
      display: flex;
      gap: 8px;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 4px;
    }
    .tab-btn {
      padding: 9px 18px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      border-radius: 8px;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 7px;
    }
    .tab-btn:hover { color: var(--text); background: rgba(255, 255, 255, 0.04); }
    .tab-btn.active {
      color: white;
      background: rgba(99, 102, 241, 0.2);
      border: 1px solid rgba(99, 102, 241, 0.4);
    }
    .tab-btn.theme-cdid.active {
      background: rgba(16, 185, 129, 0.2);
      border-color: rgba(16, 185, 129, 0.4);
    }
    .tab-btn.theme-dds.active {
      background: rgba(245, 158, 11, 0.2);
      border-color: rgba(245, 158, 11, 0.4);
    }

    .tab-panel { display: none; flex-direction: column; gap: 18px; }
    .tab-panel.active { display: flex; }

    .card-section {
      background: var(--bg-card);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .card-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.6px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .control-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 18px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      transition: border-color 0.2s;
    }
    .control-row:hover { border-color: rgba(255, 255, 255, 0.15); }
    .control-meta h4 { font-size: 14px; font-weight: 700; margin-bottom: 3px; }
    .control-meta p { font-size: 12px; color: var(--text-muted); }

    .switch {
      position: relative;
      display: inline-block;
      width: 48px;
      height: 26px;
      flex-shrink: 0;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: rgba(255, 255, 255, 0.1);
      transition: .3s cubic-bezier(0.4, 0, 0.2, 1);
      border-radius: 34px;
      border: 1px solid var(--card-border);
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .3s cubic-bezier(0.4, 0, 0.2, 1);
      border-radius: 50%;
    }
    input:checked + .slider { background-color: var(--success); border-color: var(--success); box-shadow: 0 0 12px var(--success-glow); }
    input:checked + .slider:before { transform: translateX(22px); }

    .range-box { display: flex; flex-direction: column; gap: 8px; width: 100%; }
    .range-header { display: flex; justify-content: space-between; align-items: center; }
    .range-val { font-family: var(--mono); font-weight: 700; color: #a5b4fc; }
    input[type=range] {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      outline: none;
      -webkit-appearance: none;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--primary);
      cursor: pointer;
      box-shadow: 0 0 10px var(--primary-glow);
      border: 2px solid white;
    }

    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 14px;
    }
    .metric-tile {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 14px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .metric-title { font-size: 11px; text-transform: uppercase; color: var(--text-muted); font-weight: 700; letter-spacing: 0.5px; }
    .metric-number { font-size: 22px; font-weight: 800; font-family: var(--mono); }

    .btn {
      padding: 9px 16px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      border: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
    }
    .btn-primary { background: var(--primary); color: white; box-shadow: 0 4px 14px var(--primary-glow); }
    .btn-primary:hover { background: var(--primary-hover); transform: translateY(-1px); }
    .btn-success { background: var(--success); color: white; box-shadow: 0 4px 14px var(--success-glow); }
    .btn-success:hover { background: #059669; }
    .btn-danger { background: rgba(239, 68, 68, 0.2); border: 1px solid rgba(239, 68, 68, 0.4); color: #fca5a5; }
    .btn-danger:hover { background: rgba(239, 68, 68, 0.4); color: white; }
    .btn-outline { background: rgba(255, 255, 255, 0.05); border: 1px solid var(--card-border); color: var(--text); }
    .btn-outline:hover { background: rgba(255, 255, 255, 0.1); border-color: rgba(255, 255, 255, 0.2); }

    .console-box {
      background: rgba(4, 6, 12, 0.95);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 16px;
      font-family: var(--mono);
      font-size: 12px;
      max-height: 280px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .log-row { display: flex; gap: 10px; line-height: 1.5; }
    .log-ts { color: var(--text-muted); opacity: 0.6; }
    .log-SUCCESS { color: var(--success); }
    .log-INFO { color: #60a5fa; }
    .log-WARN { color: var(--warning); }
    .log-ERROR { color: var(--danger); font-weight: 700; }
  </style>
</head>
<body>
  <header>
    <div class="brand-wrap">
      <div class="brand-logo">OE</div>
      <div class="brand-info">
        <h1>ONEEIGHT COMMAND CENTER <span class="brand-tag">v3.0 MODULAR</span></h1>
        <p>Universal Multi-Game WebSocket Controller</p>
      </div>
    </div>
    <div class="header-right">
      <div class="status-pill">
        <div class="pulse-dot" id="headerWsDot"></div>
        <span id="headerWsStatus">Menghubungkan...</span>
      </div>
    </div>
  </header>

  <div class="app-layout">
    <aside class="sidebar">
      <div class="sidebar-header">
        <span class="sidebar-title">Armada Akun (Fleet)</span>
        <span class="badge-count" id="fleetBadge">0 Bot</span>
      </div>
      <div class="fleet-list" id="fleetList">
        <div class="fleet-item active" id="item_ALL" onclick="selectBot('ALL')">
          <div class="fleet-avatar">🌐</div>
          <div class="fleet-item-info">
            <div class="fleet-item-name">Semua Akun (Global)</div>
            <div class="fleet-item-sub">Aksi Massal Seluruh Armada</div>
          </div>
        </div>
      </div>
    </aside>

    <main class="content-view" id="mainContentView">
    </main>
  </div>

  <script>
    const WS_URL = "__WS_URL__?role=controller";
    let socket = null;
    let bots = new Map();
    let selectedBotId = "ALL";
    let activeTab = "tab_autofarm";
    let logsHistory = [];

    // =========================================================================
    // 1. GAME REGISTRY (EXTENSIBLE CONTRACT)
    // =========================================================================
    const GameRegistry = {
      cdid_menu: {
        id: "cdid_menu",
        name: "CDID Main Menu",
        icon: "🏰",
        color: "#3b82f6",
        currency: "Rp",
        formatMoney: (num) => formatRupiah(num),
        metricUnit: "Maps",
        tabs: [
          { id: "tab_server_gateway", label: "🌐 Server Gateway & Maps", render: (bot) => renderCDIDMenuPortal(bot) },
          { id: "tab_safety", label: "🛡️ Safety & Rejoin", render: (bot) => renderSafetyTab(bot) },
          { id: "tab_logs", label: "📟 Live Console", render: (bot) => renderLogsTab(bot) }
        ]
      },
      cdid: {
        id: "cdid",
        name: "Car Driving Indonesia (Jatim)",
        icon: "🚚",
        color: "#10b981",
        currency: "Rp",
        formatMoney: (num) => formatRupiah(num),
        metricUnit: "Trips",
        tabs: [
          { id: "tab_autofarm", label: "📦 Auto Farm Truck", render: (bot) => renderCDIDFarm(bot) },
          { id: "tab_nav", label: "🚗 Navigasi & Kendaraan", render: (bot) => renderCDIDNav(bot) },
          { id: "tab_safety", label: "🛡️ Safety & Rejoin", render: (bot) => renderSafetyTab(bot) },
          { id: "tab_perf", label: "⚡ Optimasi & GPU", render: (bot) => renderPerfTab(bot) },
          { id: "tab_logs", label: "📟 Live Console", render: (bot) => renderLogsTab(bot) }
        ]
      },
      dds: {
        id: "dds",
        name: "Drag Drive Simulator",
        icon: "🏁",
        color: "#f59e0b",
        currency: "Coins",
        formatMoney: (num) => (num || 0).toLocaleString() + " Coins",
        metricUnit: "Races",
        tabs: [
          { id: "tab_autofarm", label: "🏁 Auto Drag Race", render: (bot) => renderDDSFarm(bot) },
          { id: "tab_safety", label: "🛡️ Safety & Rejoin", render: (bot) => renderSafetyTab(bot) },
          { id: "tab_perf", label: "⚡ Optimasi & GPU", render: (bot) => renderPerfTab(bot) },
          { id: "tab_logs", label: "📟 Live Console", render: (bot) => renderLogsTab(bot) }
        ]
      },
      generic: {
        id: "generic",
        name: "Roblox Game",
        icon: "🎮",
        color: "#6366f1",
        currency: "Cash",
        formatMoney: (num) => (num || 0).toLocaleString(),
        metricUnit: "Cycles",
        tabs: [
          { id: "tab_safety", label: "🛡️ Safety & Rejoin", render: (bot) => renderSafetyTab(bot) },
          { id: "tab_perf", label: "⚡ Optimasi & GPU", render: (bot) => renderPerfTab(bot) },
          { id: "tab_logs", label: "📟 Live Console", render: (bot) => renderLogsTab(bot) }
        ]
      }
    };

    function getGameConfig(gameId) {
      return GameRegistry[gameId] || GameRegistry.generic;
    }

    function formatRupiah(num) {
      if (!num) return "Rp 0";
      return "Rp " + Math.floor(num).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".");
    }

    // =========================================================================
    // 2. UI COMPONENT BUILDER API (DECLARATIVE HELPERS)
    // =========================================================================
    const UI = {
      KickAlertBanner: (bot) => {
        if (!bot.isKicked) return "";
        return `
          <div class="kick-banner">
            <div class="kick-banner-left">
              <span class="kick-banner-icon">🚨</span>
              <div>
                <div class="kick-banner-title">
                  ROBLOX DISCONNECT / KICK DETECTED!
                </div>
                <div class="kick-banner-desc">
                  Alasan: ${bot.kickReason || "Koneksi terputus dari server"}
                </div>
              </div>
            </div>
            <div style="display:flex; gap: 8px;">
              <button class="btn btn-primary" onclick="rejoinBot('${bot.botId}')">Rejoin Server Sekarang</button>
            </div>
          </div>
        `;
      },

      Section: (title, innerHtml) => `
        <div class="card-section">
          <div class="card-title">${title}</div>
          ${innerHtml}
        </div>
      `,

      Toggle: (label, desc, isChecked, onchangeCode) => `
        <div class="control-row">
          <div class="control-meta">
            <h4>${label}</h4>
            <p>${desc}</p>
          </div>
          <label class="switch">
            <input type="checkbox" ${isChecked ? 'checked' : ''} onchange="${onchangeCode}">
            <span class="slider"></span>
          </label>
        </div>
      `,

      Slider: (label, desc, min, max, step, value, unitLabel, oninputCode, onchangeCode) => `
        <div class="control-row">
          <div class="range-box">
            <div class="range-header">
              <div class="control-meta">
                <h4>${label}</h4>
                <p>${desc}</p>
              </div>
              <span class="range-val" id="rangeLabel_${label.replace(/\s+/g, '_')}">${Number(value).toLocaleString()} ${unitLabel}</span>
            </div>

    // =========================================================================
    // 3. WEBSOCKET CONTROLLER ENGINE
    // =========================================================================
    function initWebSocket() {
      const dot = document.getElementById("headerWsDot");
      const statusText = document.getElementById("headerWsStatus");

      socket = new WebSocket(WS_URL);

      socket.onopen = () => {
        dot.className = "pulse-dot online";
        statusText.innerText = "Gateway Online";
        addLog("System", "Terhubung ke Cloudflare Durable Object!", "SUCCESS");
      };

      socket.onclose = () => {
        dot.className = "pulse-dot";
        statusText.innerText = "Disconnected";
        addLog("System", "Koneksi terputus. Mencoba reconnect...", "WARN");
        setTimeout(initWebSocket, 3000);
      };

      socket.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          handleSocketMessage(data);
        } catch (e) {}
      };
    }

    function handleSocketMessage(data) {
      if (data.type === "SYNC_BOTS") {
        bots.clear();
        (data.bots || []).forEach(b => bots.set(b.id || b.botId, b));
        renderSidebar();
        renderMainView();
      } else if (data.type === "BOT_JOINED") {
        bots.set(data.bot.botId, data.bot);
        renderSidebar();
        renderMainView();
        addLog(data.bot.name, `Akun baru bergabung (${data.bot.gameName || 'Roblox'})!`, "SUCCESS");
      } else if (data.type === "BOT_LEFT") {
        bots.delete(data.botId);
        if (selectedBotId === data.botId) selectedBotId = "ALL";
        renderSidebar();
        renderMainView();
        addLog(data.name || "Bot", "Akun terputus dari jaringan.", "WARN");
      } else if (data.type === "BOT_TELEMETRY") {
        const existing = bots.get(data.botId);
        if (existing) {
          Object.assign(existing, data.payload || {});
          renderSidebar();
          renderMainView();
        }
      } else if (data.type === "BOT_KICKED") {
        const existing = bots.get(data.botId);
        if (existing) {
          existing.isKicked = true;
          existing.kickReason = data.reason;
          existing.status = `KICKED (${data.reason})`;
          renderSidebar();
          renderMainView();
        }
        addLog(data.botName || "Bot", `ROBLOX KICK: ${data.reason}`, "ERROR");
      } else if (data.type === "BOT_LOG") {
        addLog(data.botName || "Bot", data.log, data.level);
      }
    }

    function addLog(source, msg, level) {
      const d = new Date();
      const timeStr = d.toTimeString().split(" ")[0];
      logsHistory.push({ time: timeStr, source, msg, level: level || "INFO" });
      if (logsHistory.length > 100) logsHistory.shift();

      const consoleBox = document.getElementById("botConsoleBox");
      if (consoleBox) {
        const div = document.createElement("div");
        div.className = "log-row";
        div.innerHTML = `<span class="log-ts">[${timeStr}] [${source}]</span> <span class="log-${level}">${msg}</span>`;
        consoleBox.appendChild(div);
        consoleBox.scrollTop = consoleBox.scrollHeight;
      }
    }

    function sendBotCommand(botId, action, payload) {
      if (!socket || socket.readyState !== WebSocket.OPEN) return;
      socket.send(JSON.stringify({
        type: "COMMAND",
        targetBotId: botId,
        action: action,
        payload: payload || {}
      }));
    }

    function sendFleetCommand(action, payload) {
      sendBotCommand("ALL", action, payload);
    }

    function rejoinBot(botId) {
      sendBotCommand(botId, "REJOIN_SERVER");
      addLog("Controller", "Mengirim perintah Rejoin Server ke bot...", "WARN");
    }

    function toggleAutoRejoin(botId, enabled) {
      sendBotCommand(botId, "TOGGLE_AUTO_REJOIN", { enabled });
    }

              <button class="btn btn-outline" style="width: 100%; justify-content: center;" onclick="sendBotCommand('${bot.botId}', 'JOIN_MAP', { mapKey: 'Bali', code: '${activeCode}' })">Masuk Bali</button>
            </div>

            <div class="control-row" style="flex-direction: column; align-items: flex-start; gap: 12px;">
              <div>
                <h4 style="display: flex; align-items: center; gap: 6px;">❄️ Seasonal 🇮🇩</h4>
                <p style="font-size: 11px; color: var(--text-muted); margin-top: 2px;">Event Musiman CDID</p>
              </div>
              <button class="btn btn-outline" style="width: 100%; justify-content: center;" onclick="sendBotCommand('${bot.botId}', 'JOIN_MAP', { mapKey: 'Seasonal', code: '${activeCode}' })">Masuk Seasonal</button>
            </div>
          </div>
        `)}
      `;
    }

    function renderCDIDFarm(bot) {
      const gameCfg = getGameConfig("cdid");
      return `
        ${UI.Section("Pengaturan CDID Truck Auto Farm", `
          ${UI.Toggle("Aktifkan CDID Truck Auto Farm", "Eksekusi 6-State (Despawn, HQ, Route, Spawner, Seat, 50s Payout)", bot.isFarming, `sendBotCommand('${bot.botId}', '${bot.isFarming ? 'STOP_FARM' : 'START_FARM'}')`)}
          ${UI.Slider("Batas Jarak Minimum Rute", "Hanya terima pengiriman kargo bernilai tinggi", 50000, 150000, 5000, bot.minDistance || 100000, "studs",
            `document.getElementById('rangeLabel_Batas_Jarak_Minimum_Rute').innerText = Number(this.value).toLocaleString() + ' studs'`,
            `sendBotCommand('${bot.botId}', 'SET_MIN_DISTANCE', { minDistance: this.value })`
          )}
        `)}

        <div class="metrics-grid">
          ${UI.MetricTile("Saldo Akun (Live Cash)", gameCfg.formatMoney(bot.currentCash), "#10b981")}
          ${UI.MetricTile("Total Pendapatan Sesi", "+" + gameCfg.formatMoney(bot.totalEarnings), "#818cf8")}
          ${UI.MetricTile("Pengiriman Selesai", (bot.tripCount || 0) + " Trips", "#f59e0b")}
          ${UI.MetricTile("Durasi Sesi", bot.sessionTime || "00:00:00", "#cbd5e1")}
          ${UI.MetricTile("Status Siklus 6-State", bot.status || "STANDBY", "#6ee7b7")}
          ${UI.MetricTile("Rute Kargo Aktif", bot.currentRoute || "IDLE", "#93c5fd")}
        </div>
      `;
    }

    function renderCDIDNav(bot) {
      return `
        ${UI.Section("Kontrol Lokasi & Armada Truk", `
          ${UI.ButtonRow("Teleportasi ke Depo HQ Truk", "Pindahkan karakter instan ke markas kargo Jawa Timur", "Teleport HQ", "btn-outline", `sendBotCommand('${bot.botId}', 'TELEPORT_HQ')`)}
        `)}
      `;
    }

    function renderDDSFarm(bot) {
      const gameCfg = getGameConfig("dds");
      return `
        ${UI.Section("Pengaturan Drag Drive Simulator", `
          ${UI.Toggle("Aktifkan DDS Auto Drag Race", "Mulai antrian balapan otomatis", bot.isFarming, `sendBotCommand('${bot.botId}', '${bot.isFarming ? 'STOP_FARM' : 'START_FARM'}')`)}
        `)}

        <div class="metrics-grid">
          ${UI.MetricTile("Koin / Saldo", gameCfg.formatMoney(bot.currentCash), "#f59e0b")}
          ${UI.MetricTile("Total Pendapatan Sesi", "+" + gameCfg.formatMoney(bot.totalEarnings), "#fbbf24")}
          ${UI.MetricTile("Balapan Selesai", (bot.tripCount || 0) + " Races", "#38bdf8")}
          ${UI.MetricTile("Durasi Sesi", bot.sessionTime || "00:00:00", "#cbd5e1")}
        </div>
      `;
    }

    function renderSafetyTab(bot) {
      return `
        ${UI.Section("Sistem Proteksi Kick & Rejoin", `
          ${UI.ButtonRow("Rejoin Server Saat Ini", "Koneksikan ulang akun ke server baru", "Rejoin Sekarang", "btn-primary", `rejoinBot('${bot.botId}')`)}
          ${UI.Toggle("Auto-Rejoin Otomatis Saat Kena Kick", "Otomatis sambungkan ulang ke server baru dalam 5 detik saat terlempar kick", bot.autoRejoin !== false, `toggleAutoRejoin('${bot.botId}', this.checked)`)}
          ${UI.ButtonRow("Status Proteksi Kick Engine", "Mendengarkan 100% dialog error Roblox (Error 267, 273, 277, 268)", "AKTIF (NATIVE)", "btn-outline", "")}
        `)}
      `;
    }

    function renderPerfTab(bot) {
      return `
        ${UI.Section("Performa & AFK 24/7", `
          ${UI.Toggle("Low GPU Mode (Disable 3D Rendering)", "Mematikan render 3D game Roblox di perangkat untuk hemat CPU/GPU 85%", bot.lowRender, `sendBotCommand('${bot.botId}', 'TOGGLE_LOW_RENDER')`)}
          ${UI.ButtonRow("Anti-AFK Protection", "Mencegah Roblox mendiskoneksikan akun karena idle 20 menit", "SELALU AKTIF", "btn-outline", "")}
        `)}
      `;
    }

    function renderLogsTab(bot) {
      return `
        ${UI.Section("Live Console & F9 Stream", `
          <div class="console-box" id="botConsoleBox">
            ${renderLogsHTML()}
          </div>
        `)}
      `;
    }

    function renderLogsHTML() {
      if (logsHistory.length === 0) {
        return '<div style="color: var(--text-muted); font-style: italic;">Belum ada log aktivitas dari client...</div>';
      }
      return logsHistory.map(l => `
        <div class="log-row">
          <span class="log-ts">[${l.time}] [${l.source}]</span>
          <span class="log-${l.level}">${l.msg}</span>
        </div>
      `).join('');
    }

    // Init WebSocket Gateway on Page Load
    initWebSocket();
  </script>
</body>
</html>
